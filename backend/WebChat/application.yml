server:
  port: 8080

jwt:
  privateKey: ${JWT_PRIVATE_KEY}
  expirationSeconds: ${JWT_EXPIRATION_SECONDS}

spring:
  application:
    name: GalaxyChat

  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_SECRET_KEY}
  bucket-name: ${SUPABASE_BUCKET}