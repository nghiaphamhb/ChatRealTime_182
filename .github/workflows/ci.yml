name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: backend-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend initialized
        id: be
        shell: bash
        run: |
          if [ -f "backend/pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.be.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test (Maven)
        if: steps.be.outputs.exists == 'true'
        working-directory: backend
        run: mvn -B -q test

      - name: Backend skipped
        if: steps.be.outputs.exists != 'true'
        run: |
          echo "Skip backend: backend/pom.xml not found."

  frontend:
    name: frontend-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend initialized
        id: fe
        shell: bash
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.fe.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        if: steps.fe.outputs.exists == 'true'
        working-directory: frontend
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint (if exists)
        if: steps.fe.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Test (if exists)
        if: steps.fe.outputs.exists == 'true'
        working-directory: frontend
        run: npm test --if-present

      - name: Build (if exists)
        if: steps.fe.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build --if-present

      - name: Frontend skipped
        if: steps.fe.outputs.exists != 'true'
        run: |
          echo "Skip frontend: frontend/package.json not found."
