name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: backend-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend exists
        id: be
        shell: bash
        run: |
          if [ -f "backend/pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.be.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test (Maven)
        if: steps.be.outputs.exists == 'true'
        working-directory: backend
        run: mvn -B -q test

      - name: Backend not initialized (skipped)
        if: steps.be.outputs.exists != 'true'
        run: echo "backend/pom.xml not found -> skipping backend job"

  frontend:
    name: frontend-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend exists
        id: fe
        shell: bash
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.fe.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.fe.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.fe.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test (if exists)
        if: steps.fe.outputs.exists == 'true'
        working-directory: frontend
        run: npm test --if-present

      - name: Build
        if: steps.fe.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

      - name: Frontend not initialized (skipped)
        if: steps.fe.outputs.exists != 'true'
        run: echo "frontend/package.json not found -> skipping frontend job"
